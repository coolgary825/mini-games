<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>준우네 게임천국</title>
<meta name="theme-color" content="#3a56d6" />
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;background:linear-gradient(160deg,#141b34,#0c1020);color:#eef;
    font-family:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;-webkit-user-select:none;user-select:none;}
  .wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:28px;text-align:center;}
  h1{font-size:34px;margin:0;letter-spacing:1px;}
  p.sub{color:#9fb0e6;margin:0;font-size:15px;}
  .games{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;width:100%;max-width:760px;}
  a.card{text-decoration:none;color:#fff;background:#171f3a;border:2px solid #2e3a66;border-radius:18px;padding:22px;transition:.14s;box-shadow:0 8px 20px rgba(0,0,0,.35);}
  a.card:hover{transform:translateY(-4px);border-color:#6f8bff;}
  a.card .em{font-size:52px;}
  a.card .nm{font-weight:800;font-size:20px;margin-top:8px;}
  a.card .ds{font-size:12px;color:#9fb0e6;margin-top:4px;line-height:1.5;}
  .tip{font-size:12px;color:#6b7bb0;max-width:520px;line-height:1.7;}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>🎮 우리집 게임천국</h1>
    <p class="sub">직접 만든 게임 3종 · 폰에서 홈 화면에 추가하면 앱처럼!</p>
  </div>
  <div class="games">
    <a class="card" href="roblox/"><div class="em">🎮</div><div class="nm">미니 로블록스</div><div class="ds">15개 미니게임 · 로벅스 · 아바타</div></a>
    <a class="card" href="defense/"><div class="em">🛡️</div><div class="nm">몬스터 디펜스</div><div class="ds">타워로 몬스터 막기 · 무기 뽑기</div></a>
    <a class="card" href="brainrot/"><div class="em">🧠</div><div class="nm">브레인롯 훔치기</div><div class="ds">훔치고 벌고 도둑 막기</div></a>
  </div>
  <div class="tip">📱 폰에서 각 게임을 연 뒤 <b>공유 → 홈 화면에 추가</b>(아이폰) 또는 <b>메뉴 → 앱 설치</b>(안드로이드)를 누르면 진짜 앱이 돼요!</div>
</div>
</body>
</html>
