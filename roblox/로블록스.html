<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>미니 로블록스</title>
<meta name="theme-color" content="#e2231a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="미니 로블록스" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" href="icon-192.png" />
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:#0e1220;color:#eef;
    font-family:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;-webkit-user-select:none;user-select:none;overflow:hidden;}
  #app{display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px;height:100vh;}
  h1{font-size:22px;margin:2px;letter-spacing:1px;}
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;font-weight:800;}
  .chip{background:#1a2140;border:1px solid #2e3a66;border-radius:999px;padding:6px 14px;cursor:default;}
  .chip.click{cursor:pointer;}
  .chip b{color:#ffd54a;}
  button{font-family:inherit;font-weight:800;font-size:14px;color:#fff;background:#e2231a;border:2px solid #ff6a5c;border-radius:12px;padding:9px 16px;cursor:pointer;transition:.12s;}
  button:hover{filter:brightness(1.1);transform:translateY(-1px);}
  button.gray{background:#3a4266;border-color:#586296;}
  button.green{background:#2f8a52;border-color:#43d693;}
  button:disabled{opacity:.4;cursor:not-allowed;transform:none;}
  #stage{position:relative;}
  canvas{background:#0f1830;border-radius:14px;border:2px solid #2e3a66;display:block;box-shadow:0 12px 30px rgba(0,0,0,.5);max-width:100%;height:auto;}
  .screen{position:absolute;inset:0;display:none;flex-direction:column;overflow:auto;}
  .screen.on{display:flex;}
  #lobby{padding:18px;gap:14px;background:linear-gradient(160deg,#141b34,#0f1526);border-radius:14px;}
  #lobby h2{margin:0;font-size:24px;text-align:center;}
  .games{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
  .gcard{background:#0f1526;border:2px solid #2e3a66;border-radius:14px;padding:14px;text-align:center;cursor:pointer;transition:.12s;}
  .gcard:hover{transform:translateY(-3px);border-color:#ff6a5c;}
  .gcard .em{font-size:44px;}
  .gcard .nm{font-weight:800;margin-top:6px;}
  .gcard .ds{font-size:11px;color:#9fb0e6;margin-top:2px;line-height:1.4;}
  .gcard .bs{font-size:11px;color:#ffd54a;margin-top:4px;}
  .ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(6,9,20,.86);border-radius:14px;padding:16px;z-index:5;}
  .ov.on{display:flex;}
  .card{background:#141b34;border:2px solid #2e3a66;border-radius:16px;padding:22px;text-align:center;max-width:560px;width:100%;}
  .card h2{margin:0 0 6px;}
  .card p{margin:0 0 14px;color:#9fb0e6;}
  .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center;}
  input{font-family:inherit;font-size:15px;padding:8px;border-radius:8px;border:2px solid #2e3a66;background:#0f1526;color:#fff;width:130px;text-align:center;}
  .swatch{width:34px;height:34px;border-radius:8px;border:3px solid transparent;cursor:pointer;}
  .swatch.sel{border-color:#fff;}
  #exitBtn{position:absolute;top:10px;left:10px;z-index:6;}
  #gameHud{position:absolute;top:10px;right:10px;z-index:6;background:rgba(6,9,20,.7);border:1px solid #2e3a66;border-radius:10px;padding:6px 12px;font-weight:800;font-size:14px;}
  .hint{font-size:12px;color:#8fa0d6;text-align:center;max-width:860px;line-height:1.6;}
</style>
</head>
<body>
<div id="app">
  <h1>🎮 미니 로블록스</h1>
  <div class="bar">
    <span class="chip click" id="acctChip" onclick="switchAccount()">👤 <b id="pName">-</b></span>
    <span class="chip">🟡 <b id="rbx">0</b></span>
    <span class="chip">⭐ Lv <b id="lvl">1</b></span>
    <span class="chip click" id="muteChip" onclick="toggleMute()">🔊</span>
  </div>
  <div id="stage">
    <canvas id="cv" width="900" height="600"></canvas>

    <!-- 게임 상단 UI -->
    <button id="exitBtn" class="gray" style="display:none" onclick="quitGame()">← 로비</button>
    <div id="gameHud" style="display:none"></div>

    <!-- 로비 -->
    <div id="lobby" class="screen">
      <h2>🎮 게임 로비</h2>
      <div class="row">
        <button class="green" onclick="openAvatar()">🛍️ 아바타 상점</button>
        <button onclick="openBoost()">🚀 부스트 상점</button>
        <button class="gray" onclick="openAch()">📜 업적</button>
        <button class="gray" onclick="openRank()">🏆 랭킹</button>
      </div>
      <div class="games" id="gameGrid"></div>
      <div class="hint">게임을 골라 로벅스를 모으고, 아바타를 꾸며보세요! 게임마다 조작법은 시작할 때 안내돼요.</div>
    </div>

    <!-- 계정 선택 -->
    <div id="acctOv" class="ov on"><div class="card" id="acctBox"></div></div>
    <!-- 아바타 -->
    <div id="avatarOv" class="ov"><div class="card" id="avatarBox"></div></div>
    <!-- 부스트 -->
    <div id="boostOv" class="ov"><div class="card" id="boostBox"></div></div>
    <!-- 랭킹 -->
    <div id="rankOv" class="ov"><div class="card" id="rankBox"></div></div>
    <!-- 업적 -->
    <div id="achOv" class="ov"><div class="card" id="achBox"></div></div>
    <!-- 결과 -->
    <div id="resultOv" class="ov"><div class="card" id="resultBox"></div></div>
  </div>
</div>

<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),$=id=>document.getElementById(id);
const W=cv.width,H=cv.height;
function rr(x,y,w,h,r){ ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath(); }

// ===== 사운드 =====
let actx=null,muted=false;
function beep(f,d,t='square',v=0.1,s){ if(muted)return; try{ if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();
  let o=actx.createOscillator(),g=actx.createGain();o.type=t;o.frequency.setValueAtTime(f,actx.currentTime);
  if(s)o.frequency.linearRampToValueAtTime(s,actx.currentTime+d);g.gain.setValueAtTime(v,actx.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d);}catch(e){} }
const sfx={jump:()=>beep(500,.1,'square',.1,720),coin:()=>beep(880,.07,'square',.08,1200),hit:()=>beep(200,.2,'sawtooth',.12,90),
  win:()=>beep(600,.4,'sine',.16,1600),shoot:()=>beep(680,.05,'square',.05),ui:()=>beep(520,.08,'sine',.1,760)};

// ===== 계정/저장 =====
const SAVE_BASE="roblox_save_v1", PMETA_KEY=SAVE_BASE+"_profiles";
const PROFILES=[{k:"papa",n:"아빠",e:"👨"},{k:"junwoo",n:"준우",e:"🧒"},{k:"eunwoo",n:"은우",e:"👦"},{k:"riu",n:"리우",e:"👶"}];
const AVATARS=["👨","👩","🧒","👦","👧","👶","🧑","🦸","🦹","🧙","🥷","🐱","🐶","🐼","🦊","🐸","🦁","🐯","🤖","👽","🦄","🐲","👑","⭐"];
// 🛍️ 상점 아이템 (로벅스로 구매, c=가격)
const SHOP_COLORS=[{v:"#e2231a",c:0},{v:"#4dd2ff",c:0},{v:"#43d693",c:0},{v:"#ff9d3d",c:80},{v:"#ffd54a",c:120},{v:"#7a3dd6",c:220},{v:"#ff5bd0",c:320},{v:"#b8c0d0",c:150},{v:"#111827",c:450}];
const SHOP_HATS=[{v:"",c:0},{v:"🧢",c:60},{v:"🎓",c:120},{v:"🎀",c:100},{v:"🎩",c:180},{v:"😎",c:200},{v:"🐱",c:280},{v:"🔥",c:350},{v:"🌟",c:450},{v:"👑",c:600},{v:"🦄",c:900},{v:"👽",c:1500}];
const FREE_C=["#e2231a","#4dd2ff","#43d693"], FREE_H=[""];
let SAVE=SAVE_BASE, prof={k:"",name:"-",avatar:"👤"};
let robux=0, best={}, avatar={color:"#e2231a",hat:"",ownedC:FREE_C.slice(),ownedH:FREE_H.slice()}, boosts={};
let xp=0, lastDaily="", pstats={played:0,earned:0}, achUnlocked={};
function level(){ return 1+Math.floor(xp/300); }
function today(){ let d=new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
function toggleMute(){ muted=!muted; $('muteChip').textContent=muted?"🔇":"🔊"; }
const ACH=[
  {k:"play5",  n:"게임 입문",  d:"게임 5판 하기",     chk:()=>pstats.played>=5,  rew:100},
  {k:"play25", n:"게임 마스터",d:"게임 25판 하기",    chk:()=>pstats.played>=25, rew:500},
  {k:"rich",   n:"부자",       d:"로벅스 2000 모으기", chk:()=>robux>=2000,       rew:300},
  {k:"lv5",    n:"레벨 5",     d:"레벨 5 달성",        chk:()=>level()>=5,        rew:400},
  {k:"snake",  n:"긴 뱀",      d:"스네이크 길이 20",   chk:()=>(best.snake||0)>=17,rew:250},
  {k:"fish",   n:"낚시왕",     d:"낚시 점수 300",      chk:()=>(best.fishing||0)>=300,rew:500},
  {k:"all",    n:"올라운더",   d:"서로 다른 게임 8종 플레이", chk:()=>Object.keys(best).length>=8, rew:800},
];
// 🚀 실력 부스트 (로벅스로 구매, 영구 적용)
const BOOSTS=[
  {k:"x2",    name:"로벅스 2배",  em:"💰", cost:800,  desc:"모든 게임에서 로벅스 2배 획득"},
  {k:"speed", name:"빠른 발",    em:"👟", cost:400,  desc:"이동 게임에서 25% 빠르게"},
  {k:"djump", name:"더블 점프",  em:"🕊️", cost:500,  desc:"공중에서 한 번 더 점프 (오비·타워·공룡)"},
  {k:"revive",name:"부활 1회",   em:"❤️", cost:600,  desc:"죽어도 그 판에 한 번 되살아나기"},
  {k:"tank",  name:"튼튼함",     em:"🛡️", cost:450,  desc:"슈팅에서 체력 60% 더"},
  {k:"time",  name:"시간 연장",  em:"⏱️", cost:350,  desc:"두더지 +10초 · 낚시 놓침 허용 +2"},
];
function spd(){ return boosts.speed?1.25:1; }
function ensureOwned(){ if(!avatar.ownedC)avatar.ownedC=[]; if(!avatar.ownedH)avatar.ownedH=[];
  FREE_C.forEach(c=>{if(!avatar.ownedC.includes(c))avatar.ownedC.push(c);}); FREE_H.forEach(h=>{if(!avatar.ownedH.includes(h))avatar.ownedH.push(h);}); }
function loadPMeta(){ try{return JSON.parse(localStorage.getItem(PMETA_KEY))||{};}catch(e){return{};} }
function savePMeta(m){ try{localStorage.setItem(PMETA_KEY,JSON.stringify(m));}catch(e){} }
function profMeta(k){ let m=loadPMeta(),d=PROFILES.find(p=>p.k===k)||{n:k,e:"👤"},e=m[k]||{}; return {name:e.name||d.n,avatar:e.avatar||d.e}; }
function setProfMeta(k,p){ let m=loadPMeta(); m[k]=Object.assign(profMeta(k),m[k]||{},p); savePMeta(m); }
function load(){ try{ let s=JSON.parse(localStorage.getItem(SAVE)); if(s){ robux=s.robux||0; best=s.best||{}; if(s.avatar) avatar=s.avatar; boosts=s.boosts||{}; xp=s.xp||0; lastDaily=s.lastDaily||""; if(s.pstats)pstats=s.pstats; if(s.achUnlocked)achUnlocked=s.achUnlocked; } }catch(e){} ensureOwned(); }
function save(){ try{ localStorage.setItem(SAVE,JSON.stringify({robux,best,avatar,boosts,xp,lastDaily,pstats,achUnlocked})); }catch(e){} }
function checkAch(){ ACH.forEach(a=>{ if(!achUnlocked[a.k]&&a.chk()){ achUnlocked[a.k]=true; robux+=a.rew; toast(`🏅 업적: ${a.n}! +${a.rew}`); sfx.win(); } }); }
function toast(t){ setTimeout(()=>{ let d=document.createElement('div'); d.textContent=t; d.style.cssText="position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:200;background:#141b34;border:2px solid #ffd54a;color:#fff;font-weight:800;padding:10px 18px;border-radius:12px;box-shadow:0 8px 20px rgba(0,0,0,.5)"; document.body.appendChild(d); setTimeout(()=>d.remove(),2200); },10); }
function acctScore(k){ try{ let s=JSON.parse(localStorage.getItem(SAVE_BASE+"_"+k)); if(!s) return {val:-1,label:"기록 없음"};
  let tot=Object.values(s.best||{}).reduce((a,b)=>a+Number(b||0),0); return {val:(s.robux||0)+tot, label:`🟡${s.robux||0}`}; }catch(e){ return {val:-1,label:"기록 없음"}; } }

// ===== 아바타 그리기 (블록 캐릭터) =====
function drawAvatar(x,y,s,col,hat){ col=col||avatar.color; hat= hat!==undefined?hat:avatar.hat;
  ctx.fillStyle="rgba(0,0,0,.3)"; ctx.beginPath(); ctx.ellipse(x,y+s*0.95,s*0.5,s*0.18,0,0,7); ctx.fill();
  ctx.fillStyle=col; rr(x-s*0.42,y+s*0.05,s*0.84,s*0.6,s*0.12); ctx.fill();           // 몸
  ctx.fillStyle="#ffd9a8"; rr(x-s*0.32,y-s*0.55,s*0.64,s*0.62,s*0.14); ctx.fill();     // 머리
  ctx.fillStyle="#222"; ctx.beginPath(); ctx.arc(x-s*0.12,y-s*0.28,s*0.06,0,7); ctx.arc(x+s*0.12,y-s*0.28,s*0.06,0,7); ctx.fill();
  ctx.strokeStyle="#222"; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(x,y-s*0.12,s*0.1,0.1,Math.PI-0.1); ctx.stroke();
  if(hat){ ctx.font=`${s*0.7}px serif`; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText(hat,x,y-s*0.62); }
}

// ===== 입력 =====
let keys={}, mouse={x:0,y:0,down:false};
addEventListener('keydown',e=>{ keys[e.key.toLowerCase()]=true; if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase())) e.preventDefault();
  if(scene==='game'&&game&&game.key) game.key(e.key.toLowerCase(),true); });
addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false; });
function cpos(e){ let R=cv.getBoundingClientRect(); let t=e.touches?e.touches[0]:e; return {x:(t.clientX-R.left)*(W/R.width),y:(t.clientY-R.top)*(H/R.height)}; }
cv.addEventListener('mousemove',e=>{ let p=cpos(e); mouse.x=p.x; mouse.y=p.y; });
cv.addEventListener('mousedown',e=>{ mouse.down=true; let p=cpos(e); mouse.x=p.x;mouse.y=p.y; if(scene==='game'&&game&&game.click) game.click(p.x,p.y); });
addEventListener('mouseup',()=>mouse.down=false);
cv.addEventListener('touchstart',e=>{ e.preventDefault(); mouse.down=true; let p=cpos(e); mouse.x=p.x;mouse.y=p.y; if(scene==='game'&&game&&game.click) game.click(p.x,p.y); if(scene==='game'&&game&&game.touch)game.touch(p.x,p.y,true); },{passive:false});
cv.addEventListener('touchmove',e=>{ e.preventDefault(); let p=cpos(e); mouse.x=p.x;mouse.y=p.y; if(scene==='game'&&game&&game.touch)game.touch(p.x,p.y,true); },{passive:false});
cv.addEventListener('touchend',e=>{ e.preventDefault(); mouse.down=false; if(scene==='game'&&game&&game.touch)game.touch(0,0,false); },{passive:false});

// ===== 게임 목록 =====
const GAMES=[
  {key:"obby",   name:"오비 점프",  em:"🟩", color:"#43d693", desc:"장애물을 뛰어넘어 깃발까지! (A/D·스페이스)"},
  {key:"dodge",  name:"피하기",     em:"☄️", color:"#ff9d3d", desc:"떨어지는 블록을 피해 오래 살아남기 (WASD)"},
  {key:"tower",  name:"점프 타워",  em:"🗼", color:"#4dd2ff", desc:"발판을 밟고 높이높이! (A/D 좌우)"},
  {key:"clicker",name:"클릭 공장",  em:"🖱️", color:"#ffd54a", desc:"클릭해서 로벅스 벌기 + 업그레이드"},
  {key:"shooter",name:"슈팅 아레나",em:"🔫", color:"#ff5b6b", desc:"몰려오는 적을 쏴서 막기 (이동WASD·마우스발사)"},
  {key:"maze",   name:"미로 탈출",  em:"🌀", color:"#b06fff", desc:"미로를 빠져나와 출구로! (WASD)"},
  {key:"dino",   name:"공룡 달리기",em:"🦖", color:"#8bd66f", desc:"장애물을 뛰어넘어 멀리! (스페이스=점프)"},
  {key:"whack",  name:"두더지 잡기",em:"🐹", color:"#ffcf6b", desc:"튀어나오는 두더지를 클릭! 30초"},
  {key:"fishing",name:"낚시",       em:"🎣", color:"#4dd2ff", desc:"물고기를 초록칸에 가둬서 낚기! (클릭유지)"},
  {key:"simon",  name:"색 기억",    em:"🎨", color:"#ff7ad6", desc:"색 순서를 외워서 똑같이 누르기"},
  {key:"snake",  name:"스네이크",   em:"🐍", color:"#43d693", desc:"사과 먹고 자라기, 벽·몸통 피하기 (WASD)"},
  {key:"breakout",name:"벽돌깨기",  em:"🧱", color:"#ff9d3d", desc:"공을 받아 벽돌 부수기 (마우스/AD)"},
  {key:"memory", name:"카드 짝",    em:"🧠", color:"#8be0ff", desc:"같은 카드 2장 찾기"},
  {key:"fruit",  name:"과일 자르기",em:"🍉", color:"#ff5b6b", desc:"날아오는 과일 클릭! 폭탄 금지"},
  {key:"balloon",name:"풍선 터뜨리기",em:"🎈",color:"#c56bff", desc:"올라가는 풍선을 클릭해서 팡!"},
];

// ===== 씬 =====
let scene='account', game=null, resultPending=false;
function showScreen(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id)); }
function closeOv(){ document.querySelectorAll('.ov').forEach(o=>{ if(o.id!=='acctOv'||scene!=='account') o.classList.remove('on'); }); }
function toLobby(){ scene='lobby'; game=null; $('exitBtn').style.display='none'; $('gameHud').style.display='none'; showScreen('lobby'); document.querySelectorAll('.ov').forEach(o=>o.classList.remove('on')); renderLobby(); save(); }
function renderLobby(){ $('rbx').textContent=robux; $('lvl').textContent=level(); let g=$('gameGrid'); g.innerHTML='';
  GAMES.forEach(gm=>{ let b=best[gm.key]||0; let d=document.createElement('div'); d.className='gcard'; d.style.borderColor=gm.color+'55';
    d.innerHTML=`<div class="em">${gm.em}</div><div class="nm" style="color:${gm.color}">${gm.name}</div><div class="ds">${gm.desc}</div><div class="bs">최고 ${b}</div>`;
    d.onclick=()=>startGame(gm.key); g.appendChild(d); }); }
function startGame(key){ scene='game'; game=makeGame(key); $('exitBtn').style.display='block'; $('gameHud').style.display='block'; showScreen(''); sfx.ui(); }
function quitGame(){ if(game&&game.reward) endGame(game.reward()); else toLobby(); }
function endGame(reward){ if(scene==='result')return; scene='result'; reward=Math.max(0,Math.round((reward||0)*(boosts.x2?2:1))); let key=game&&game.key2;
  robux+=reward; pstats.played++; pstats.earned=(pstats.earned||0)+reward;
  if(key){ let sc=game.score?game.score():reward; if(sc>(best[key]||0)) best[key]=sc; }
  let lv0=level(); xp+=reward; let lv1=level(); let lvMsg=""; if(lv1>lv0){ let bonus=lv1*60; robux+=bonus; lvMsg=`<div style="color:#43d693;font-weight:800;margin-top:6px">⭐ 레벨 업! Lv${lv1} · 보너스 +${bonus}</div>`; sfx.win(); }
  checkAch(); save(); $('lvl').textContent=level();

// ---- 1. 오비 점프 ----
function makeObby(){
  let plats=[{x:-40,y:500,w:240,h:140}]; let py=500;
  for(let i=0;i<18;i++){ let prev=plats[plats.length-1]; let gap=85+Math.random()*55; let w=85+Math.random()*45;
    py=Math.max(285,Math.min(500, py+(Math.random()*150-75)));       // 위/아래 ±75px (점프로 도달 가능)
    let mv=i>4&&Math.random()<0.28; let x=prev.x+prev.w+gap;
    plats.push({x,y:py,w,h:22,mv,bx:x,amp:mv?40:0,sp:1+Math.random(),ph:Math.random()*6}); }
  let last=plats[plats.length-1]; let goal={x:last.x+last.w+110,y:Math.max(300,last.y-30),w:170,h:26,goal:true}; plats.push(goal);
  let p={x:70,y:440,vx:0,vy:0,r:14,onG:false}, cam=0, deaths=0, t=0, done=false, spawn={x:70,y:440}, canDouble=false, coins=[], parts=[];
  plats.forEach(pl=>{ if(!pl.goal && Math.random()<0.45) coins.push({x:pl.x+pl.w/2,y:pl.y-30,bob:Math.random()*6}); });
  function jump(){ if(p.onG){ p.vy=-560; p.onG=false; canDouble=true; sfx.jump(); } else if(boosts.djump&&canDouble){ p.vy=-500; canDouble=false; sfx.jump(); for(let i=0;i<6;i++)parts.push({x:p.x,y:p.y+10,vx:(Math.random()-.5)*90,vy:Math.random()*40,life:1}); } }
  return { key2:"obby", score(){return Math.max(0,300-deaths*15);}, reward(){return Math.max(30,160-deaths*8);},
    key(k){ if(k===' '||k==='w'||k==='arrowup') jump(); },
    update(dt){ if(done)return; t+=dt;
      let dir=(keys['d']||keys['arrowright']?1:0)-(keys['a']||keys['arrowleft']?1:0); p.vx=dir*255*spd();
      p.vy+=1250*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.onG=false;
      for(let pl of plats){ if(pl.mv) pl.x=pl.bx+Math.sin(t*pl.sp+pl.ph)*pl.amp;
        if(p.x+p.r>pl.x && p.x-p.r<pl.x+pl.w && p.vy>=0 && p.y+p.r>pl.y && p.y+p.r<pl.y+pl.h+20){ p.y=pl.y-p.r; p.vy=0; p.onG=true; canDouble=true; spawn={x:Math.max(pl.x+24,Math.min(p.x,pl.x+pl.w-24)),y:pl.y-30}; } }
      for(let c of coins){ if(!c.got && Math.hypot(c.x-p.x,c.y-(p.y-14))<24){ c.got=true; robux+=2; sfx.coin(); for(let i=0;i<8;i++)parts.push({x:c.x,y:c.y,vx:(Math.random()-.5)*150,vy:(Math.random()-.5)*150,life:1,g:1}); $('rbx').textContent=robux; } }
      coins=coins.filter(c=>!c.got);
      for(let pt of parts){ pt.x+=pt.vx*dt; pt.y+=pt.vy*dt; pt.vy+=200*dt; pt.life-=dt*1.6; } parts=parts.filter(pt=>pt.life>0);
      if(p.y>H+120){ deaths++; sfx.hit(); p.x=spawn.x;p.y=spawn.y;p.vx=0;p.vy=0; }
      if(p.x>goal.x+20 && p.y<goal.y+40){ done=true; endGame(this.reward()); }
      cam=Math.max(0,Math.min(goal.x-W+260, p.x-300));
    },
    draw(){ let sky=ctx.createLinearGradient(0,0,0,H); sky.addColorStop(0,"#12305a"); sky.addColorStop(1,"#0f1830"); ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);
      ctx.fillStyle="#7a1a12"; ctx.fillRect(0,H-26,W,26);
      ctx.save(); ctx.translate(-cam,0);
      for(let pl of plats){ ctx.fillStyle= pl.goal?"#43d693":(pl.mv?"#ff9d3d":"#4a5c92"); rr(pl.x,pl.y,pl.w,pl.h,6); ctx.fill();
        ctx.fillStyle="rgba(255,255,255,.12)"; rr(pl.x,pl.y,pl.w,5,4); ctx.fill(); }
      for(let c of coins){ ctx.fillStyle="#ffd54a"; ctx.beginPath(); ctx.arc(c.x,c.y+Math.sin(t*4+c.bob)*3,8,0,7); ctx.fill(); ctx.strokeStyle="#b8860b";ctx.lineWidth=2;ctx.stroke(); }
      for(let pt of parts){ ctx.globalAlpha=Math.max(0,pt.life); ctx.fillStyle=pt.g?"#ffd54a":"#cdd8ff"; ctx.beginPath(); ctx.arc(pt.x,pt.y,3,0,7); ctx.fill(); } ctx.globalAlpha=1;
      ctx.fillStyle="#43d693"; ctx.fillRect(goal.x+goal.w/2,goal.y-40,4,40); ctx.beginPath();ctx.moveTo(goal.x+goal.w/2+4,goal.y-40);ctx.lineTo(goal.x+goal.w/2+28,goal.y-32);ctx.lineTo(goal.x+goal.w/2+4,goal.y-24);ctx.fill();
      drawAvatar(p.x,p.y-14,20,avatar.color,avatar.hat);
      ctx.restore(); hud(`💀 ${deaths} · 🟡코인 먹기 · 🏁깃발까지! (A/D·스페이스${boosts.djump?"·더블점프":""})`);
    } };
}

// ---- 2. 피하기 ----
function makeDodge(){ let p={x:W/2,y:H-80,r:16}, blocks=[], t=0, spawnT=0, alive=true, reviveUsed=false, inv=0, msg="",msgT=0;
  return { key2:"dodge", score(){return Math.floor(t);}, reward(){return Math.floor(t*3);},
    update(dt){ if(!alive){ endGame(this.reward()); return; } t+=dt; if(inv>0)inv-=dt; if(msgT>0)msgT-=dt; let sp=(260+t*8)*spd();

      for(let b of blocks){ b.y+=b.vy*dt; if(inv<=0&&p.x>b.x-2&&p.x<b.x+b.w+2&&p.y>b.y-2&&p.y<b.y+b.w+2){ if(!reviveUsed&&boosts.revive){ reviveUsed=true; blocks=[]; inv=2; msg="부활! ❤️";msgT=1.4; sfx.coin(); break; } else { alive=false; sfx.hit(); } } }
      blocks=blocks.filter(b=>b.y<H+40);
    },
    draw(){ let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#141b34");g.addColorStop(1,"#0f1526");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
      for(let b of blocks){ ctx.fillStyle=b.col||"#ff5b6b"; rr(b.x,b.y,b.w,b.w,6); ctx.fill(); ctx.fillStyle="rgba(255,255,255,.25)"; rr(b.x+3,b.y+3,b.w-6,4,3); ctx.fill(); }
      if(!(inv>0&&Math.floor(t*10)%2)) drawAvatar(p.x,p.y-4,20,avatar.color,avatar.hat);
      if(msgT>0){ ctx.fillStyle="#ff9db0";ctx.font="800 24px system-ui";ctx.textAlign="center";ctx.fillText(msg,W/2,120); }
      hud(`⏱️ ${t.toFixed(1)}초  ·  피해라!`);
    } };
}

// ---- 3. 점프 타워 (두들점프) ----
function makeTower(){
  let plats=[{x:W/2-40,y:H-70,w:80,spr:false}];                 // 시작 발판(플레이어 아래) — 버그 수정
  for(let i=1;i<13;i++) plats.push({x:Math.random()*(W-90)+10,y:H-70-i*66,w:80,spr:Math.random()<0.14});
  let p={x:W/2,y:H-110,vx:0,vy:-560,r:15}, hi=0, over=false, coins=[], parts=[], canDouble=false, reviveUsed=false, t=0, msg="", msgT=0;
  function addCoin(pl){ if(Math.random()<0.45) coins.push({x:pl.x+pl.w/2,y:pl.y-26,bob:Math.random()*6}); }
  plats.forEach(addCoin);
  return { key2:"tower", score(){return Math.floor(hi);}, reward(){return Math.floor(hi/9);},
    key(k){ if((k===' '||k==='w'||k==='arrowup') && boosts.djump && canDouble){ p.vy=-560; canDouble=false; sfx.jump(); } },
    update(dt){ if(over){ endGame(this.reward()); return; } t+=dt;
      let dir=(keys['d']||keys['arrowright']?1:0)-(keys['a']||keys['arrowleft']?1:0); p.vx=dir*330;
      p.vy+=1350*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; if(p.x<-10)p.x=W+10; if(p.x>W+10)p.x=-10;
      for(let pl of plats){ if(p.vy>0 && p.x>pl.x-6 && p.x<pl.x+pl.w+6 && p.y+p.r>pl.y && p.y+p.r<pl.y+18){ p.vy= pl.spr?-960:-660; canDouble=true; sfx.jump();
        for(let i=0;i<6;i++)parts.push({x:p.x,y:p.y+14,vx:(Math.random()-.5)*90,vy:Math.random()*50,life:1}); } }
      if(p.y<H*0.42){ let d=H*0.42-p.y; p.y=H*0.42; hi+=d/10; plats.forEach(pl=>pl.y+=d); coins.forEach(c=>c.y+=d); parts.forEach(pt=>pt.y+=d);
        plats=plats.filter(pl=>pl.y<H+30); coins=coins.filter(c=>c.y<H+30);
        while(plats.length<13){ let my=Math.min(...plats.map(pl=>pl.y)); let np={x:Math.random()*(W-90)+10,y:my-66,w:80,spr:Math.random()<0.14}; plats.push(np); addCoin(np); } }

function makeMaze(){ const CW=21,CH=15,CS=40; let g=[]; for(let r=0;r<CH;r++){g[r]=[];for(let c=0;c<CW;c++)g[r][c]=1;}
  function carve(r,c){ g[r][c]=0; let ds=[[0,2],[0,-2],[2,0],[-2,0]].sort(()=>Math.random()-0.5);
    for(let[dr,dc]of ds){ let nr=r+dr,nc=c+dc; if(nr>0&&nr<CH-1&&nc>0&&nc<CW-1&&g[nr][nc]===1){ g[r+dr/2][c+dc/2]=0; carve(nr,nc); } } }
  carve(1,1); let ox=(W-CW*CS)/2, oy=(H-CH*CS)/2+10;
  let p={x:ox+CS*1.5,y:oy+CS*1.5,r:12}, ex={r:CH-2,c:CW-2}, t=0, done=false; g[ex.r][ex.c]=0; g[ex.r][ex.c-1]=0;
  function wall(x,y){ let c=Math.floor((x-ox)/CS),r=Math.floor((y-oy)/CS); if(r<0||r>=CH||c<0||c>=CW)return true; return g[r][c]===1; }
  return { key2:"maze", score(){return Math.max(0,300-Math.floor(t*2));}, reward(){return Math.max(15,200-Math.floor(t*3));},
    update(dt){ if(done){ endGame(this.reward()); return; } t+=dt; let sp=170*spd();
      let nx=p.x+((keys['d']||keys['arrowright']?1:0)-(keys['a']||keys['arrowleft']?1:0))*sp*dt;
      let ny=p.y+((keys['s']||keys['arrowdown']?1:0)-(keys['w']||keys['arrowup']?1:0))*sp*dt;
      if(!wall(nx-p.r,p.y)&&!wall(nx+p.r,p.y)&&!wall(nx,p.y-p.r)&&!wall(nx,p.y+p.r)) p.x=nx;
      if(!wall(p.x-p.r,ny)&&!wall(p.x+p.r,ny)&&!wall(p.x,ny-p.r)&&!wall(p.x,ny+p.r)) p.y=ny;
      if(Math.hypot(p.x-(ox+ex.c*CS+CS/2),p.y-(oy+ex.r*CS+CS/2))<20){ done=true; sfx.win(); }
    },
    draw(){ ctx.fillStyle="#0d1226"; ctx.fillRect(0,0,W,H);
      for(let r=0;r<CH;r++)for(let c=0;c<CW;c++){ if(g[r][c]===1){ ctx.fillStyle="#2c3a6e"; rr(ox+c*CS,oy+r*CS,CS,CS,4); ctx.fill(); } }
      ctx.font="26px serif";ctx.textAlign="center";ctx.textBaseline="middle"; ctx.fillText("🚪",ox+ex.c*CS+CS/2,oy+ex.r*CS+CS/2);
      drawAvatar(p.x,p.y-4,18,avatar.color,avatar.hat); hud(`⏱️ ${t.toFixed(1)}초 · 출구🚪를 찾아라`);
    } };
}

      drawAvatar(150,H-120,46,avatar.color,avatar.hat); ctx.strokeStyle="rgba(255,255,255,.6)"; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(185,H-165); ctx.lineTo(TX,TY-6); ctx.stroke();
      // 트랙
      ctx.fillStyle="rgba(4,20,34,.55)"; rr(TX-24,TY,48,TH,14); ctx.fill();
      ctx.fillStyle="rgba(67,214,147,.5)"; rr(TX-21,TY+box.y,42,box.h,10); ctx.fill(); ctx.strokeStyle="#43d693"; ctx.lineWidth=2; rr(TX-21,TY+box.y,42,box.h,10); ctx.stroke();
      ctx.font="32px serif"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText(fish.e,TX,TY+fy);
      // 진행바
      ctx.fillStyle="#0a1526"; rr(TX+36,TY,20,TH,8); ctx.fill(); ctx.fillStyle=fish.c; rr(TX+36,TY+TH-TH*prog/100,20,TH*prog/100,8); ctx.fill();
      ctx.font="800 12px system-ui"; ctx.fillStyle="#fff"; ctx.fillText(fish.n,TX,TY-14);
      // 잡은 목록
      ctx.font="22px serif"; ctx.textAlign="left"; ctx.fillText("잡음: "+caught.slice(-10).map(f=>f.e).join(""),34,54);
      if(msgT>0){ ctx.fillStyle="#fff"; ctx.font="800 22px system-ui"; ctx.textAlign="center"; ctx.fillText(msg,W/2,H-46); }
      hud(`⏱️ ${Math.ceil(time)}초 · 💰 ${score} · 클릭/스페이스 유지=올리기`);
    } };
}
// ---- 10. 색 기억 (사이먼) ----
function makeSimon(){ const C=["#e2231a","#43d693","#4dd2ff","#ffd54a"]; let seq=[],input=[],showing=true,si=0,flash=-1,flashT=0,wait=0.7,round=0,over=false,lock=false;
  function next(){ round++; seq.push(Math.floor(Math.random()*4)); input=[]; showing=true; si=0; wait=0.6; lock=false; }
  next();
  return { key2:"simon", score(){return round-1;}, reward(){return (round-1)*15;},
    click(x,y){ if(showing||over||lock)return; let b=(x<W/2?0:1)+(y<H/2?0:2); flash=b;flashT=0.25; input.push(b); sfx.ui();
      if(b!==seq[input.length-1]){ over=true; sfx.hit(); return; }
      if(input.length===seq.length){ lock=true; setTimeout(()=>{ if(!over) next(); },600); } },
    update(dt){ if(over){endGame(this.reward());return;} if(flashT>0)flashT-=dt;
      if(showing){ wait-=dt; if(wait<=0){ if(si<seq.length){ flash=seq[si];flashT=0.4;si++;wait=0.75; } else { showing=false;flash=-1; } } } },
    draw(){ ctx.fillStyle="#0d1226"; ctx.fillRect(0,0,W,H);
      for(let i=0;i<4;i++){ let qx=(i%2)*W/2, qy=(i<2?0:1)*H/2; ctx.globalAlpha=(flash===i&&flashT>0)?1:0.32; ctx.fillStyle=C[i]; rr(qx+8,qy+8,W/2-16,H/2-16,16); ctx.fill(); }
      ctx.globalAlpha=1; hud(`🎨 라운드 ${round} · ${showing?"잘 봐! 👀":"똑같이 눌러!"}`);
    } };
}

// ---- 11. 스네이크 ----
function makeSnake(){ const N=22,M=15,CS=Math.min((W-40)/N,(H-60)/M),ox=(W-N*CS)/2,oy=(H-M*CS)/2+10;
  let snake=[{x:5,y:7}],dir={x:1,y:0},ndir={x:1,y:0},food={x:12,y:7},grow=3,step=0,over=false,score=0;
  function place(){ do{ food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*M)}; }while(snake.some(s=>s.x===food.x&&s.y===food.y)); }
  return { key2:"snake", score(){return score;}, reward(){return score*3;},
    key(k){ if((k==='w'||k==='arrowup')&&dir.y===0)ndir={x:0,y:-1}; else if((k==='s'||k==='arrowdown')&&dir.y===0)ndir={x:0,y:1}; else if((k==='a'||k==='arrowleft')&&dir.x===0)ndir={x:-1,y:0}; else if((k==='d'||k==='arrowright')&&dir.x===0)ndir={x:1,y:0}; },
    update(dt){ if(over){endGame(this.reward());return;} step+=dt; if(step<0.11)return; step=0; dir=ndir;
      let h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
      if(h.x<0||h.x>=N||h.y<0||h.y>=M||snake.some(s=>s.x===h.x&&s.y===h.y)){ over=true; sfx.hit(); return; }
      snake.unshift(h); if(h.x===food.x&&h.y===food.y){ score++; grow+=2; sfx.coin(); place(); } if(grow>0)grow--; else snake.pop(); },
    draw(){ ctx.fillStyle="#0d1f12"; ctx.fillRect(0,0,W,H); ctx.fillStyle="#12331d"; rr(ox,oy,N*CS,M*CS,8); ctx.fill();
      ctx.font=`${CS}px serif`;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("🍎",ox+food.x*CS+CS/2,oy+food.y*CS+CS/2);
      snake.forEach((s,i)=>{ ctx.fillStyle=i===0?"#43d693":`hsl(${140+i*4},60%,${45-Math.min(20,i)}%)`; rr(ox+s.x*CS+1,oy+s.y*CS+1,CS-2,CS-2,4); ctx.fill(); });
      hud(`🐍 길이 ${snake.length} · 🍎먹고 자라기 (WASD)`); } };
}
// ---- 12. 벽돌깨기 ----
function makeBreakout(){ let paddle={x:W/2,w:120}, ball={x:W/2,y:H-130,vx:220,vy:-330,r:8}, bricks=[], over=false, broke=0, lives=3, cleared=false;
  const cols=["#ff5b6b","#ff9d3d","#ffd54a","#43d693","#4dd2ff"];
  for(let r=0;r<5;r++)for(let c=0;c<11;c++) bricks.push({x:40+c*76,y:80+r*32,w:68,h:22,col:cols[r]});
  return { key2:"breakout", score(){return broke;}, reward(){return broke*3+(cleared?120:0);},
    update(dt){ if(over){endGame(this.reward());return;}
      if(keys['a']||keys['arrowleft'])paddle.x-=460*dt; if(keys['d']||keys['arrowright'])paddle.x+=460*dt; if(mouse.x&&scene==='game')paddle.x=mouse.x;
      paddle.x=Math.max(paddle.w/2,Math.min(W-paddle.w/2,paddle.x));
      ball.x+=ball.vx*dt; ball.y+=ball.vy*dt;
      if(ball.x<ball.r||ball.x>W-ball.r)ball.vx*=-1; if(ball.y<ball.r)ball.vy*=-1;
      if(ball.y>H-72 && ball.y<H-50 && ball.x>paddle.x-paddle.w/2 && ball.x<paddle.x+paddle.w/2 && ball.vy>0){ ball.vy=-Math.abs(ball.vy); ball.vx+=(ball.x-paddle.x)*3; ball.vx=Math.max(-400,Math.min(400,ball.vx)); sfx.jump(); }
      if(ball.y>H+20){ lives--; if(lives<=0){over=true;sfx.hit();} else { ball={x:W/2,y:H-130,vx:220,vy:-330,r:8}; } }
      for(let b of bricks){ if(!b.dead && ball.x>b.x-ball.r&&ball.x<b.x+b.w+ball.r&&ball.y>b.y-ball.r&&ball.y<b.y+b.h+ball.r){ b.dead=true; broke++; ball.vy*=-1; sfx.coin(); break; } }
      bricks=bricks.filter(b=>!b.dead); if(!bricks.length){ cleared=true; over=true; sfx.win(); } },
    draw(){ ctx.fillStyle="#0f1526"; ctx.fillRect(0,0,W,H);
      for(let b of bricks){ ctx.fillStyle=b.col; rr(b.x,b.y,b.w,b.h,5); ctx.fill(); ctx.fillStyle="rgba(255,255,255,.2)";rr(b.x,b.y,b.w,4,3);ctx.fill(); }
      ctx.fillStyle="#fff"; rr(paddle.x-paddle.w/2,H-60,paddle.w,14,7); ctx.fill();
      ctx.fillStyle="#ffd54a"; ctx.beginPath(); ctx.arc(ball.x,ball.y,ball.r,0,7); ctx.fill();
      hud(`🧱 ${broke} · ❤️ ${lives} · 마우스/AD로 공 받기`); } };
}
// ---- 13. 카드 짝맞추기 ----
function makeMemory(){ const emo=["🐶","🐱","🦊","🐼","🦁","🐸","🐵","🐷"]; let deck=[...emo,...emo].sort(()=>Math.random()-0.5).map(e=>({e,up:false,done:false}));
  const Col=4,CW=110,CH=110,gap=14,gw=Col*(CW+gap)-gap,gh=4*(CH+gap)-gap,ox=(W-gw)/2,oy=(H-gh)/2+8;
  let sel=[],lock=0,matched=0,moves=0,over=false;
  return { key2:"memory", score(){return Math.max(0,200-moves*4);}, reward(){return Math.max(25,160-moves*4);},
    click(x,y){ if(lock>0)return; for(let i=0;i<deck.length;i++){ let c=deck[i],cx=ox+(i%Col)*(CW+gap),cy=oy+Math.floor(i/Col)*(CH+gap);
      if(x>cx&&x<cx+CW&&y>cy&&y<cy+CH&&!c.up&&!c.done){ c.up=true; sel.push(i); sfx.ui();
        if(sel.length===2){ moves++; if(deck[sel[0]].e===deck[sel[1]].e){ deck[sel[0]].done=deck[sel[1]].done=true; matched++; sfx.coin(); sel=[]; if(matched===8){over=true;sfx.win();} } else lock=0.7; } break; } } },
    update(dt){ if(over){endGame(this.reward());return;} if(lock>0){ lock-=dt; if(lock<=0){ deck[sel[0]].up=deck[sel[1]].up=false; sel=[]; } } },
    draw(){ ctx.fillStyle="#141b34"; ctx.fillRect(0,0,W,H);
      for(let i=0;i<deck.length;i++){ let c=deck[i],cx=ox+(i%Col)*(CW+gap),cy=oy+Math.floor(i/Col)*(CH+gap);
        ctx.fillStyle=c.done?"#12291f":(c.up?"#2f6b8a":"#3a4266"); rr(cx,cy,CW,CH,12); ctx.fill();
        ctx.font="52px serif";ctx.textAlign="center";ctx.textBaseline="middle"; if(c.up||c.done){ctx.fillText(c.e,cx+CW/2,cy+CH/2);} else {ctx.fillStyle="#586296";ctx.font="40px serif";ctx.fillText("❓",cx+CW/2,cy+CH/2);} }
      hud(`🧠 짝 ${matched}/8 · 시도 ${moves} · 같은 카드 찾기`); } };
}
// ---- 14. 과일 자르기 ----
function makeFruit(){ let fr=[],t=0,spawnT=0,score=0,lives=3,over=false,parts=[]; const F=["🍉","🍎","🍊","🍇","🍓","🍍","🥝","🍑"];
  return { key2:"fruit", score(){return score;}, reward(){return score*3;},
    click(x,y){ for(let f of fr){ if(!f.cut&&Math.hypot(x-f.x,y-f.y)<40){ f.cut=true; if(f.bomb){ over=true; sfx.hit(); } else { score++; sfx.coin(); for(let i=0;i<8;i++)parts.push({x:f.x,y:f.y,vx:(Math.random()-.5)*220,vy:(Math.random()-.5)*220,life:1,c:f.col}); } } } },
    update(dt){ if(over){endGame(this.reward());return;} t+=dt; spawnT-=dt;
      if(spawnT<=0){ spawnT=Math.max(0.38,0.9-t*0.016); let bomb=Math.random()<0.15; fr.push({x:80+Math.random()*(W-160),y:H+30,vx:(Math.random()-.5)*130,vy:-(560+Math.random()*190),bomb,e:bomb?"💣":F[Math.floor(Math.random()*F.length)],col:["#ff5b6b","#ff9d3d","#ffd54a","#c56bff","#43d693"][Math.floor(Math.random()*5)]}); }
      for(let f of fr){ f.x+=f.vx*dt; f.y+=f.vy*dt; f.vy+=720*dt; if(f.y>H+50&&!f.cut&&!f.bomb){ f.gone=true; lives--; if(lives<=0){over=true;sfx.hit();} } }
      fr=fr.filter(f=>!f.cut&&!f.gone&&f.y<H+60);
      for(let p of parts){ p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=320*dt;p.life-=dt*1.5; } parts=parts.filter(p=>p.life>0); },
    draw(){ let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#3a1a5a");g.addColorStop(1,"#140f2c");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
      for(let p of parts){ ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,5,0,7);ctx.fill(); } ctx.globalAlpha=1;
      for(let f of fr){ ctx.font="48px serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(f.e,f.x,f.y); }
      hud(`🍉 ${score} · ❤️ ${lives} · 과일 클릭! 💣폭탄 금지`); } };
}
// ---- 15. 풍선 터뜨리기 ----
function makeBalloon(){ let bs=[],t=0,spawnT=0,score=0,missed=0,over=false; const C=["#ff5b6b","#ff9d3d","#ffd54a","#43d693","#4dd2ff","#c56bff","#ff7ad6"];
  return { key2:"balloon", score(){return score;}, reward(){return score*2;},
    click(x,y){ for(let b of bs){ if(!b.pop&&Math.hypot(x-b.x,y-b.y)<b.r+4){ b.pop=true; score++; sfx.coin(); } } },
    update(dt){ if(over){endGame(this.reward());return;} t+=dt; spawnT-=dt;
      if(spawnT<=0){ spawnT=Math.max(0.32,0.8-t*0.013); bs.push({x:60+Math.random()*(W-120),y:H+30,r:24+Math.random()*10,vy:-(90+Math.random()*70+t*3),c:C[Math.floor(Math.random()*C.length)],w:Math.random()*6}); }
      for(let b of bs){ b.y+=b.vy*dt; b.x+=Math.sin(t*2+b.w)*22*dt; if(b.y<-40&&!b.pop){ b.gone=true; missed++; if(missed>=8){over=true;sfx.hit();} } }
      bs=bs.filter(b=>!b.pop&&!b.gone); },
    draw(){ let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#1a55a0");g.addColorStop(1,"#0d1f3a");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
      for(let b of bs){ ctx.fillStyle=b.c; ctx.beginPath(); ctx.ellipse(b.x,b.y,b.r*0.85,b.r,0,0,7); ctx.fill();
        ctx.fillStyle="rgba(255,255,255,.35)";ctx.beginPath();ctx.ellipse(b.x-b.r*0.3,b.y-b.r*0.35,b.r*0.22,b.r*0.32,0,0,7);ctx.fill();
        ctx.strokeStyle="rgba(255,255,255,.4)";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(b.x,b.y+b.r);ctx.lineTo(b.x,b.y+b.r+16);ctx.stroke(); }
      hud(`🎈 ${score} · 놓침 ${missed}/8 · 풍선 클릭!`); } };
}

// ===== 루프 =====
let last=0;
function loop(ts){ let dt=Math.min(0.033,(ts-last)/1000)||0; last=ts;
  if(scene==='game'&&game){ if(game.update)game.update(dt); if(game.draw)game.draw(); }
  else { ctx.fillStyle="#0f1830"; ctx.fillRect(0,0,W,H); }
  requestAnimationFrame(loop); }
renderAcct(); requestAnimationFrame(loop);
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
